<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>POP! BATTLE — TPS Prototype</title>
    <script>
      // Verse8 플랫폼(iframe)에 게임 크기 알림 (Agent8 기본 템플릿과 같은 방식)
      (function () {
        function reportGameSize() {
          const height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
          const width = Math.max(document.body.scrollWidth, document.documentElement.scrollWidth);
          window.parent.postMessage({ type: 'GAME_SIZE_RESPONSE', height: height, width: width }, '*');
        }
        window.addEventListener('load', reportGameSize);
        window.addEventListener('resize', reportGameSize);
        window.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'REQUEST_GAME_SIZE') reportGameSize();
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">로딩 중…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
